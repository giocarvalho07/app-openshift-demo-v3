server {
  listen 4200;
  listen [::]:4200;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /assets/brand/site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|woff2?|ico|svg|png|jpg|jpeg|webp)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
